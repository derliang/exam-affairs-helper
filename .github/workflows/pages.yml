# 只做 Pages 部署（D19）；測試只在本機（pre-push hook 與 npm test）
name: Deploy Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # 2026-11-24：GitHub 的 artifact 清單在上傳後有延遲，deploy-pages 立刻查會回「Found 0 artifact(s)」而失敗；等一下再部署
      - run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5
